@if (loading()) {
  <app-loader></app-loader>
} @else {
  <div
    class="pokemon-card"
    [ngStyle]="{ 'background-color': '$white' }"
  >
    <h2>Pokémon favorito</h2>
    <div class="card">
      <img [src]="pokemonData.imageUrl || urlDefaultImg" [alt]="pokemonData.name" />
      <div class="info">
        <h3>#{{ pokemonData.id }} - {{ pokemonData.name | titlecase }}</h3>
      </div>
    </div>
  </div>
}
